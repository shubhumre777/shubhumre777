<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="t d">
<title id="t">GitHub analytics dashboard initializing</title>
<desc id="d">Placeholder for the automatically generated GitHub profile metrics dashboard. It will be replaced with live repository, language and contribution analytics after the first workflow run.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#161b35"/></linearGradient>
  <linearGradient id="c" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <filter id="g"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="420" rx="24" fill="url(#bg)"/>
<rect x="32" y="32" width="1336" height="356" rx="18" fill="none" stroke="#334155"/>
<text x="76" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#67e8f9">GITHUB / LIVE PROFILE INSIGHTS</text>
<text x="76" y="158" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#f8fafc">Your repository analytics are being prepared.</text>
<text x="76" y="202" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#a5b4fc">The first scheduled metrics run will replace this panel with repository, language and contribution data.</text>
<g transform="translate(76 260)">
  <rect width="370" height="82" rx="12" fill="#14253b" stroke="#155e75"/>
  <circle cx="34" cy="41" r="9" fill="#22d3ee" filter="url(#g)"/>
  <text x="60" y="37" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#e0f2fe">LANGUAGE BREAKDOWN</text>
  <text x="60" y="59" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#94a3b8">Live data after workflow run</text>
</g>
<g transform="translate(515 260)">
  <rect width="370" height="82" rx="12" fill="#14253b" stroke="#166534"/>
  <circle cx="34" cy="41" r="9" fill="#34d399" filter="url(#g)"/>
  <text x="60" y="37" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#dcfce7">CONTRIBUTION ACTIVITY</text>
  <text x="60" y="59" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#94a3b8">Activity calendar will populate</text>
</g>
<g transform="translate(954 260)">
  <rect width="370" height="82" rx="12" fill="#211c3b" stroke="#6d28d9"/>
  <circle cx="34" cy="41" r="9" fill="#a78bfa" filter="url(#g)"/>
  <text x="60" y="37" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#ede9fe">REPOSITORY INSIGHTS</text>
  <text x="60" y="59" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#94a3b8">Projects and activity summary</text>
</g>
<rect x="76" y="365" width="1248" height="3" rx="2" fill="url(#c)" opacity=".9"/>
</svg>