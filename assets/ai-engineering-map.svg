<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="t d">
<title id="t">AI engineering capability map</title>
<desc id="d">A colourful animated network map connecting applied machine learning, computer vision, NLP, retrieval augmented generation, agent workflows and application deployment. This is a conceptual map, not a measured skill chart.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080f1e"/><stop offset="1" stop-color="#17152d"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="430" rx="24" fill="url(#bg)"/>
<text x="60" y="62" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#67e8f9">THE AI ENGINEERING MAP</text>
<text x="60" y="94" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1.5" fill="#94a3b8">CONNECTED DISCIPLINES · ONE PRACTICAL BUILD PIPELINE</text>
<g stroke="url(#line)" stroke-width="2.5" fill="none" opacity=".8">
 <path d="M700 212L310 160M700 212L550 345M700 212L1030 145M700 212L1080 330M700 212L330 330M700 212L700 118M700 212L1045 235"/>
 <path d="M310 160L150 240M1030 145L1240 225M550 345L330 330M1080 330L1240 225"/>
</g>
<g stroke="#e0f2fe" stroke-opacity=".55" stroke-width="2" stroke-dasharray="7 12" fill="none">
 <path d="M700 212L310 160"><animate attributeName="stroke-dashoffset" values="0;38" dur="4s" repeatCount="indefinite"/></path>
 <path d="M700 212L1030 145"><animate attributeName="stroke-dashoffset" values="38;0" dur="5s" repeatCount="indefinite"/></path>
 <path d="M700 212L1080 330"><animate attributeName="stroke-dashoffset" values="0;38" dur="4.5s" repeatCount="indefinite"/></path>
</g>
<g filter="url(#glow)">
 <circle cx="700" cy="212" r="64" fill="#102b3c" stroke="#67e8f9" stroke-width="3"/>
 <circle cx="700" cy="212" r="49" fill="none" stroke="#34d399" stroke-opacity=".7"/>
 <text x="700" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#f8fafc">APPLIED</text>
 <text x="700" y="228" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#67e8f9">AI / ML</text>
</g>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
 <g><rect x="205" y="125" width="210" height="70" rx="16" fill="#102d32" stroke="#2dd4bf" stroke-width="2"/><text x="310" y="153" font-size="15" font-weight="700" fill="#ccfbf1">COMPUTER VISION</text><text x="310" y="176" font-size="12" fill="#99f6e4">YOLO · OpenCV · PyTorch</text></g>
 <g><rect x="445" y="310" width="210" height="70" rx="16" fill="#182442" stroke="#818cf8" stroke-width="2"/><text x="550" y="338" font-size="15" font-weight="700" fill="#e0e7ff">DATA &amp; MODELS</text><text x="550" y="361" font-size="12" fill="#c7d2fe">Pandas · Scikit-learn</text></g>
 <g><rect x="925" y="110" width="210" height="70" rx="16" fill="#2a1e3e" stroke="#c084fc" stroke-width="2"/><text x="1030" y="138" font-size="15" font-weight="700" fill="#f3e8ff">GENERATIVE AI</text><text x="1030" y="161" font-size="12" fill="#e9d5ff">LLMs · Embeddings · RAG</text></g>
 <g><rect x="975" y="295" width="210" height="70" rx="16" fill="#342316" stroke="#fb923c" stroke-width="2"/><text x="1080" y="323" font-size="15" font-weight="700" fill="#ffedd5">AGENTIC SYSTEMS</text><text x="1080" y="346" font-size="12" fill="#fed7aa">Tools · LangGraph · ReAct</text></g>
 <g><rect x="225" y="295" width="210" height="70" rx="16" fill="#2b1832" stroke="#f472b6" stroke-width="2"/><text x="330" y="323" font-size="15" font-weight="700" fill="#fce7f3">NLP</text><text x="330" y="346" font-size="12" fill="#fbcfe8">Text Features · Classification</text></g>
 <g><rect x="595" y="82" width="210" height="70" rx="16" fill="#0f2b40" stroke="#22d3ee" stroke-width="2"/><text x="700" y="110" font-size="15" font-weight="700" fill="#cffafe">RETRIEVAL</text><text x="700" y="133" font-size="12" fill="#a5f3fc">FAISS · BM25 · Hybrid Search</text></g>
 <g><rect x="1140" y="190" width="210" height="70" rx="16" fill="#202b1b" stroke="#a3e635" stroke-width="2"/><text x="1245" y="218" font-size="15" font-weight="700" fill="#ecfccb">APPLICATIONS</text><text x="1245" y="241" font-size="12" fill="#d9f99d">Streamlit · Interfaces</text></g>
 <g><rect x="45" y="205" width="210" height="70" rx="16" fill="#27253b" stroke="#a78bfa" stroke-width="2"/><text x="150" y="233" font-size="15" font-weight="700" fill="#ede9fe">DEPLOYMENT</text><text x="150" y="256" font-size="12" fill="#ddd6fe">GitHub · Cloud Apps</text></g>
</g>
<g fill="#f8fafc" filter="url(#glow)">
 <circle cx="310" cy="160" r="4"><animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/></circle>
 <circle cx="1030" cy="145" r="4"><animate attributeName="r" values="3;7;3" dur="2.8s" repeatCount="indefinite"/></circle>
 <circle cx="1080" cy="330" r="4"><animate attributeName="r" values="3;7;3" dur="2.1s" repeatCount="indefinite"/></circle>
</g>
</svg>