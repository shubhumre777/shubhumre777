<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="380" viewBox="0 0 1500 380" role="img" aria-labelledby="title desc">
  <title id="title">Shubh Umre — Applied AI, Machine Learning and Generative AI</title>
  <desc id="desc">A dark technology-inspired profile banner with the name Shubh Umre and focus areas in AI and machine learning, generative AI, agentic AI and computer vision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="52%" stop-color="#0d1d2b"/>
      <stop offset="100%" stop-color="#10162e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="light">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1500" height="380" rx="26" fill="url(#bg)"/>
  <ellipse cx="760" cy="150" rx="620" ry="260" fill="url(#light)"/>
  <g opacity=".18" stroke="#7dd3fc" stroke-width="1">
    <path d="M80 70H1420M80 310H1420"/>
    <path d="M210 25V355M1290 25V355"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-opacity=".6" stroke-width="2">
    <path d="M115 250L240 165L325 225L430 115"/>
    <path d="M1390 115L1280 190L1190 145L1080 250"/>
  </g>
  <g fill="#0b1c2b" stroke="#67e8f9" stroke-width="2" opacity=".9">
    <circle cx="115" cy="250" r="7"/><circle cx="240" cy="165" r="7"/><circle cx="325" cy="225" r="7"/><circle cx="430" cy="115" r="7"/>
    <circle cx="1390" cy="115" r="7"/><circle cx="1280" cy="190" r="7"/><circle cx="1190" cy="145" r="7"/><circle cx="1080" cy="250" r="7"/>
  </g>
  <text x="750" y="145" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="5" filter="url(#glow)">SHUBH UMRE</text>
  <rect x="510" y="177" width="480" height="3" rx="2" fill="url(#accent)"/>
  <text x="750" y="225" text-anchor="middle" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" letter-spacing="3">AI / MACHINE LEARNING</text>
  <text x="750" y="268" text-anchor="middle" fill="#a5f3fc" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="2">GENERATIVE AI  •  AGENTIC AI  •  COMPUTER VISION</text>
  <text x="750" y="325" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="3">BUILDING PRACTICAL SYSTEMS · EXPLORING OPEN SOURCE · LEARNING BY SHIPPING</text>
</svg>