<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
<title id="t">Three-dimensional AI orbit illustration</title>
<desc id="d">A polished 3D-style cluster of three luminous spheres connected by orbital rings, symbolising applied AI, generative AI and agentic systems.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#111b33"/><stop offset="1" stop-color="#1d1638"/></linearGradient>
  <radialGradient id="cyan" cx="32%" cy="24%" r="76%"><stop stop-color="#e0fbff"/><stop offset=".12" stop-color="#67e8f9"/><stop offset=".58" stop-color="#0891b2"/><stop offset="1" stop-color="#083344"/></radialGradient>
  <radialGradient id="green" cx="30%" cy="24%" r="76%"><stop stop-color="#ecfdf5"/><stop offset=".13" stop-color="#86efac"/><stop offset=".58" stop-color="#059669"/><stop offset="1" stop-color="#064e3b"/></radialGradient>
  <radialGradient id="violet" cx="30%" cy="24%" r="76%"><stop stop-color="#f5f3ff"/><stop offset=".13" stop-color="#c4b5fd"/><stop offset=".58" stop-color="#7c3aed"/><stop offset="1" stop-color="#2e1065"/></radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="11" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="330" rx="24" fill="url(#bg)"/>
<g opacity=".16" stroke="#94a3b8"><path d="M40 65H1160M40 265H1160"/><path d="M160 22V308M1040 22V308"/></g>
<text x="62" y="74" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="4" fill="#67e8f9" font-weight="700">THE AI ORBIT</text>
<text x="62" y="109" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cbd5e1">Three connected areas of practical AI engineering</text>
<g transform="translate(780 166)">
  <ellipse cx="0" cy="0" rx="295" ry="92" fill="none" stroke="#22d3ee" stroke-opacity=".58" stroke-width="2" transform="rotate(-14)"/>
  <ellipse cx="0" cy="0" rx="252" ry="122" fill="none" stroke="#a78bfa" stroke-opacity=".5" stroke-width="2" transform="rotate(24)"/>
  <ellipse cx="0" cy="0" rx="185" ry="142" fill="none" stroke="#34d399" stroke-opacity=".38" stroke-width="1.5" transform="rotate(-38)"/>
  <g filter="url(#glow)"><circle cx="-170" cy="-10" r="53" fill="url(#cyan)"/><circle cx="12" cy="-54" r="66" fill="url(#green)"/><circle cx="184" cy="38" r="48" fill="url(#violet)"/></g>
  <g fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <text x="-170" y="65">APPLIED AI</text><text x="12" y="31">GENERATIVE AI</text><text x="184" y="102">AGENTIC AI</text>
  </g>
  <g fill="#fff" opacity=".7"><circle cx="-204" cy="-32" r="8"/><circle cx="-11" cy="-84" r="9"/><circle cx="165" cy="17" r="7"/></g>
  <g fill="none" stroke="#e2e8f0" stroke-opacity=".65" stroke-width="1.5"><path d="M-170 -10L12 -54L184 38"/></g>
</g>
</svg>