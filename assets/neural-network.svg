<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
  <title id="title">Neural network visualization</title>
  <desc id="desc">A glowing network of connected nodes representing artificial intelligence.</desc>
  <defs>
    <radialGradient id="bg"><stop offset="0%" stop-color="#122b42"/><stop offset="100%" stop-color="#0d1117"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00ff9d" stop-opacity=".15"/><stop offset="100%" stop-color="#38bdf8" stop-opacity=".8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="520" height="300" rx="18" fill="url(#bg)"/>
  <g stroke="url(#line)" stroke-width="1.5" fill="none">
    <path d="M70 70L185 50L270 92L390 52L455 116M70 70L185 145L270 92L390 165L455 116M70 70L185 240L270 205L390 165L455 245M185 50L185 145L185 240M270 92L270 205M390 52L390 165L390 255M185 145L270 205L390 255L455 245M70 70L70 220L185 240M70 220L185 145"/>
  </g>
  <g fill="#0d1117" stroke="#00ff9d" stroke-width="2.5" filter="url(#glow)">
    <circle cx="70" cy="70" r="10"/><circle cx="70" cy="220" r="8"/>
    <circle cx="185" cy="50" r="8"/><circle cx="185" cy="145" r="12"/><circle cx="185" cy="240" r="9"/>
    <circle cx="270" cy="92" r="13"/><circle cx="270" cy="205" r="10"/>
    <circle cx="390" cy="52" r="8"/><circle cx="390" cy="165" r="13"/><circle cx="390" cy="255" r="8"/>
    <circle cx="455" cy="116" r="10"/><circle cx="455" cy="245" r="9"/>
  </g>
  <g fill="#38bdf8" opacity=".95">
    <circle cx="70" cy="70" r="3"/><circle cx="185" cy="145" r="4"/><circle cx="270" cy="92" r="4"/><circle cx="390" cy="165" r="4"/><circle cx="455" cy="116" r="3"/>
  </g>
  <text x="260" y="284" text-anchor="middle" fill="#93a4b8" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3">CONNECTED INTELLIGENCE</text>
